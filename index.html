<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: 'Outfit', system-ui, sans-serif; cursor: none; }
  .bg { position: fixed; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 3s ease; }
  .bg.show { opacity: 1; }
  .shade { position: fixed; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.2) 45%, rgba(0,0,0,.6) 100%),
                linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 50%); }
  .wrap { position: fixed; inset: 0; display: flex; justify-content: space-between; gap: 2vw;
    align-items: flex-start; padding: 6vh 4.5vw; box-sizing: border-box; }

  .time { text-align: right; text-shadow: 0 .3vw 2vw rgba(0,0,0,.45); }
  .clock { font-size: 10.5vw; font-weight: 200; line-height: .85; letter-spacing: -.02em; white-space: nowrap; }
  .clock .ampm { font-size: 2.6vw; font-weight: 300; letter-spacing: .05em; margin-left: .6vw; }
  .date { font-size: 2.3vw; font-weight: 300; margin-top: 2vh; opacity: .92; white-space: nowrap; }

  .panel { width: 28vw; flex: none; max-height: 88vh; overflow: hidden; background: rgba(0,0,0,.38);
    border-radius: 1.4vw; padding: 2.4vw 2.4vw 1.6vw; box-sizing: border-box; }
  .panel.fade { height: 88vh;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%); }
  .day { margin: 2vw 0 1.1vw; font-size: 1.2vw; font-weight: 500; letter-spacing: .25em;
    text-transform: uppercase; opacity: .7; }
  .day:first-child { margin-top: 0; }
  .none { font-size: 1.3vw; font-weight: 300; opacity: .6; margin-bottom: 1.3vw; }
  .ev { display: flex; gap: 1.1vw; margin-bottom: 1.3vw; align-items: stretch; }
  .ev .bar { width: .35vw; border-radius: .2vw; flex: none; }
  .ev .when { font-size: 1.2vw; font-weight: 400; opacity: .75; margin-bottom: .2vw; }
  .ev .title { font-size: 1.75vw; font-weight: 400; line-height: 1.2; }
  .ev .loc { font-size: 1.1vw; opacity: .6; margin-top: .2vw; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 21vw; }
  .ev.past { opacity: .4; }
  .ev.now .when { opacity: 1; font-weight: 500; }
  .tag { display: inline-block; font-size: .9vw; font-weight: 500; letter-spacing: .15em;
    padding: .15vw .55vw; border-radius: .3vw; background: rgba(255,255,255,.9); color: #000;
    margin-left: .6vw; vertical-align: .15vw; }
  .empty { font-size: 1.6vw; font-weight: 300; opacity: .8; }
  .more { font-size: 1.1vw; opacity: .6; }
  .status { position: fixed; right: 4.5vw; bottom: 2vh; font-size: .9vw; opacity: .5; }

  [hidden] { display: none !important; }
  /* To-do panel: under the clock, same glass as the calendar panel */
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; max-height: 88vh; }
  .todo { width: 26vw; flex: none; max-height: 88vh; background: rgba(0,0,0,.38); border-radius: 1.4vw;
    padding: 2vw 2.4vw 1.2vw; box-sizing: border-box; overflow: hidden; }
  .todo.fade { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%); }
  .todo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2vw; }
  .todo-head .day { margin: 0; }
  .todo-count { font-size: 1.1vw; opacity: .6; }
  .task { display: flex; gap: 1vw; align-items: flex-start; margin-bottom: 1vw; }
  .task .box { flex: none; width: 1.25vw; height: 1.25vw; margin-top: .35vw; border: .14vw solid rgba(255,255,255,.75);
    border-radius: .3vw; box-sizing: border-box; }
  .task .t { font-size: 1.6vw; font-weight: 400; line-height: 1.25; }
  .task .n { font-size: 1.1vw; opacity: .6; margin-top: .15vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 19vw; }
  .task.just-done { opacity: .45; }
  .task.just-done .t { text-decoration: line-through; }
  .task.just-done .box { background: rgba(255,255,255,.85); }
  /* Emails: under the clock, the same cards as the Emails tab on the to-do site */
  .mail { width: 100%; max-width: 32vw; margin-top: 4vh; background: rgba(0,0,0,.38); border-radius: 1.4vw;
    padding: 2vw 2.4vw 1.2vw; box-sizing: border-box; overflow: hidden; min-height: 0; flex: 0 1 auto; }
  .mail.fade { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%); }
  .mcard { margin-bottom: 1.3vw; }
  .mcard .mt { display: flex; justify-content: space-between; align-items: flex-start; gap: .8vw; }
  .mcard .mtitle { font-size: 1.45vw; font-weight: 400; line-height: 1.2; min-width: 0; }
  .mcard .chip { flex: none; font-size: .8vw; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    padding: .2vw .6vw; border-radius: 1vw; white-space: nowrap; margin-top: .2vw; }
  .chip.need { background: rgba(255,255,255,.92); color: #000; }
  .chip.wait { border: .1vw solid rgba(255,255,255,.6); opacity: .85; }
  .chip.fyi { opacity: .55; padding-left: 0; padding-right: 0; }
  .mcard .msum { font-size: 1.05vw; line-height: 1.4; opacity: .8; margin-top: .3vw;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mcard .mmeta { font-size: .9vw; opacity: .5; margin-top: .25vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Spoken alerts */
  .alert { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); min-width: 30vw; max-width: 60vw;
    background: rgba(0,0,0,.75); border-radius: 1.4vw; padding: 1.6vw 2.8vw; text-align: center;
    box-shadow: 0 1vw 4vw rgba(0,0,0,.5); }
  .alert-sub { font-size: 1.2vw; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; opacity: .75; }
  .alert-title { font-size: 2.6vw; font-weight: 400; line-height: 1.2; margin-top: .5vw; }
  .soundnote { position: fixed; left: 4.5vw; bottom: 2vh; font-size: 1vw; opacity: .6; }
</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="shade"></div>

<div class="wrap">
  <div class="panel" id="panel">
    <div id="events"></div>
  </div>
  <div class="todo" id="todo" hidden>
    <div class="todo-head"><div class="day">To-Do</div><div class="todo-count" id="todo-count"></div></div>
    <div id="tasks"></div>
  </div>
  <div class="right">
    <div class="time">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </div>
    <div class="mail" id="mail" hidden>
      <div class="todo-head"><div class="day">Emails</div><div class="todo-count" id="mail-count"></div></div>
      <div id="mails"></div>
    </div>
  </div>
</div>
<div class="status" id="status"></div>
<div class="alert" id="alert" hidden><div class="alert-sub" id="alert-sub"></div><div class="alert-title" id="alert-title"></div></div>
<div class="soundnote" id="soundnote">Press OK on the remote to turn on spoken alerts</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ===== Settings =====
// Paste your Apps Script web app URL (ends in /exec) here.
// Your token is NOT stored here: add it to the board's address as #k=yourtoken
var API_URL = 'https://script.google.com/macros/s/AKfycbxw3SW86lU8h2_EsXb0Pr71CATEgyezsodMCAV0w3CK781BfMXZm8mEV4JL-bdyL3wq3g/exec';
var CALENDAR_REFRESH_MIN = 5;   // how often to check for calendar changes
var PHOTO_CHANGE_MIN = 10;      // how often the background photo changes
var NIGHTLY_RELOAD_HOUR = 3;    // full page reload at 3 AM keeps the TV browser fresh (skipped while spoken alerts are on)
var ALERT_MINUTES = 5;          // how long before a calendar event the TV dings and reads it out
var MAX_EVENTS = 40;            // anything past what fits fades out at the bottom
// ====================

var hash = location.hash;
var DEMO = /demo/.test(hash);
var loadedAt = Date.now();
var data = null;
var lastOk = 0;
var lastError = '';

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function getToken() {
  var m = hash.match(/k=([^&]+)/);
  if (m) { var t = decodeURIComponent(m[1]); store('boardToken', t); return t; }
  return recall('boardToken');
}
var TOKEN = getToken();

function pad(n) { return (n < 10 ? '0' : '') + n; }
// All dates and times use your home time zone, no matter what the TV is set to.
// Denver time is worked out here directly (MST, or MDT during daylight saving),
// so it doesn't depend on the TV's time zone setting or the browser.
function denverOffsetHours(d) {
  var y = d.getUTCFullYear();
  function nthSunday(month, n) {
    var first = new Date(Date.UTC(y, month, 1)).getUTCDay();
    return 1 + (7 - first) % 7 + (n - 1) * 7;
  }
  var dstStart = Date.UTC(y, 2, nthSunday(2, 2), 9);   // 2nd Sunday of March, 2 AM MST
  var dstEnd = Date.UTC(y, 10, nthSunday(10, 1), 8);   // 1st Sunday of November, 2 AM MDT
  var t = d.getTime();
  return (t >= dstStart && t < dstEnd) ? -6 : -7;
}
function P(d) {
  var s = new Date(d.getTime() + denverOffsetHours(d) * 3600000);
  return { y: s.getUTCFullYear(), m: s.getUTCMonth() + 1, d: s.getUTCDate(),
           h: s.getUTCHours(), min: s.getUTCMinutes(), dow: s.getUTCDay() };
}
function ymd(d) { var p = P(d); return p.y + '-' + pad(p.m) + '-' + pad(p.d); }
function fmtTime(d) {
  var p = P(d), h = p.h % 12 || 12;
  return h + ':' + pad(p.min) + ' ' + (p.h < 12 ? 'AM' : 'PM');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

// ----- Clock -----
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August',
  'September','October','November','December'];
var lastMinute = -1, lastDay = '';

function tick() {
  var now = new Date();
  var np = P(now);
  if (np.min !== lastMinute) {
    lastMinute = np.min;
    var h = np.h % 12 || 12;
    document.getElementById('clock').innerHTML =
      h + ':' + pad(np.min) + '<span class="ampm">' + (np.h < 12 ? 'AM' : 'PM') + '</span>';
    document.getElementById('date').textContent =
      DAYS[np.dow] + ', ' + MONTHS[np.m - 1] + ' ' + np.d;

    var today = ymd(now);
    if (lastDay && today !== lastDay) fetchCalendar();   // new day: get the new day's events
    lastDay = today;

    render();
    renderMail();
    updateStatus();

    if (np.h === NIGHTLY_RELOAD_HOUR && np.min === 0 && !soundOn &&
        Date.now() - loadedAt > 60 * 60 * 1000) {
      location.reload();
    }
  }
  setTimeout(tick, 1000 - now.getMilliseconds() + 20);
}

// ----- Calendar -----
function fetchCalendar() {
  if (DEMO) { data = demoData(); lastOk = Date.now(); render(); renderMail(); return; }
  if (!TOKEN) { lastError = 'Add #k=yourtoken to the end of this page’s address.'; render(); return; }
  if (API_URL.indexOf('http') !== 0) { lastError = 'Paste your Apps Script URL into API_URL in index.html.'; render(); return; }

  var url = API_URL + '?token=' + encodeURIComponent(TOKEN) + '&t=' + Date.now();
  fetch(url, { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (json) {
      if (json.error) throw new Error(json.error === 'unauthorized' ? 'Token doesn’t match the one in Code.gs.' : json.error);
      data = json; lastOk = Date.now(); lastError = '';
      store('boardCache', JSON.stringify(json));
      render(); renderMail(); updateStatus();
      // New photos in the folder (or the first time we learn about them): show one right away.
      var pk = (json.photos || []).slice().sort().join(',');
      if (pk && pk !== photoKey) nextPhoto();
    })
    .catch(function (err) {
      lastError = err && err.message ? err.message : 'Could not reach calendar.';
      render(); updateStatus();
    });
}

var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dayKeyOf(ev, today) {
  var k = ev.allDay ? ev.start : ymd(new Date(ev.start));
  return k < today ? today : k;
}
function dayLabel(k, today) {
  if (k === today) return 'Today';
  var p = today.split('-');
  var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + 1));
  if (k === t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate())) return 'Tomorrow';
  var q = k.split('-');
  var d = new Date(Date.UTC(+q[0], +q[1] - 1, +q[2]));
  return DAYS[d.getUTCDay()] + ', ' + MONTHS_SHORT[d.getUTCMonth()] + ' ' + d.getUTCDate();
}

function render() {
  var box = document.getElementById('events');
  var panel = document.getElementById('panel');
  var now = new Date();
  var today = ymd(now);
  panel.className = 'panel';

  if (!data) {
    box.innerHTML = '<div class="empty">' + esc(lastError || 'Loading…') + '</div>';
    return;
  }
  if (data.date !== today) {
    box.innerHTML = '<div class="empty">Updating…</div>';
    return;
  }


  // Drop all-day events that already ended, tag each with its display day, sort.
  var evs = (data.events || []).filter(function (ev) {
    return ev.allDay ? ev.end > today : true;
  }).map(function (ev) {
    ev._day = dayKeyOf(ev, today);
    return ev;
  });
  evs.sort(function (a, b) {
    if (a._day !== b._day) return a._day < b._day ? -1 : 1;
    if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
    return a.start < b.start ? -1 : a.start > b.start ? 1 : 0;
  });
  evs = evs.slice(0, MAX_EVENTS);

  var html = '<div class="day">Today</div>';
  var current = today;
  if (!evs.length || evs[0]._day !== today) html += '<div class="none">Nothing on today</div>';

  evs.forEach(function (ev) {
    if (ev._day !== current) {
      current = ev._day;
      html += '<div class="day">' + dayLabel(current, today) + '</div>';
    }
    var cls = 'ev', when, tag = '';
    if (ev.allDay) {
      when = 'All day';
    } else {
      var s = new Date(ev.start), e = new Date(ev.end);
      if (e <= now) cls += ' past';
      else if (s <= now) { cls += ' now'; tag = '<span class="tag">NOW</span>'; }
      when = ymd(s) < today ? 'Until ' + fmtTime(e) : fmtTime(s) + ' – ' + fmtTime(e);
    }
    html += '<div class="' + cls + '">' +
      '<div class="bar" style="background:' + esc(ev.color || '#fff') + '"></div>' +
      '<div><div class="when">' + when + tag + '</div>' +
      '<div class="title">' + esc(ev.title) + '</div>' +
      (ev.location ? '<div class="loc">' + esc(ev.location) + '</div>' : '') +
      '</div></div>';
  });

  if (evs.length && evs[evs.length - 1]._day === today && evs.length < MAX_EVENTS) {
    html += '<div class="day">Coming up</div><div class="none">Nothing else in the next two weeks</div>';
  }
  box.innerHTML = html;

  // Fade into the bottom only when the list is longer than the panel.
  if (box.scrollHeight > window.innerHeight * 0.88 - 40) panel.className = 'panel fade';
}

function updateStatus() {
  var el = document.getElementById('status');
  var stale = lastOk && Date.now() - lastOk > (CALENDAR_REFRESH_MIN * 3) * 60 * 1000;
  if (data && (lastError || stale)) {
    el.textContent = 'Calendar offline · last updated ' + fmtTime(new Date(lastOk || Date.parse(data.updated)));
  } else {
    el.textContent = '';
  }
}

// ----- Background photos -----
var showingA = false;
// Your own photos come from the "TV Photos" folder in Google Drive, through the calendar
// script (already shrunk to TV size). With no photos in the folder, random ones are used.
var photoOrder = [], photoIdx = 0, photoKey = '';

function randomPhotoSrc() {
  var w = Math.min(2560, Math.round(screen.width * (window.devicePixelRatio || 1))) || 1920;
  var h = Math.round(w * 9 / 16);
  return 'https://picsum.photos/' + w + '/' + h + '?random=' + Date.now();
}

function showPhoto(src) {
  var img = new Image();
  img.onload = function () {
    var next = document.getElementById(showingA ? 'bgB' : 'bgA');
    var prev = document.getElementById(showingA ? 'bgA' : 'bgB');
    next.style.backgroundImage = 'url("' + img.src + '")';
    next.classList.add('show');
    prev.classList.remove('show');
    showingA = !showingA;
  };
  img.src = src;
}

function nextPhoto() {
  var ids = (data && data.photos) || [];
  if (!ids.length || DEMO || !TOKEN || API_URL.indexOf('http') !== 0) { showPhoto(randomPhotoSrc()); return; }
  var key = ids.slice().sort().join(',');
  if (key !== photoKey || photoIdx >= photoOrder.length) {
    photoKey = key; photoIdx = 0;
    photoOrder = ids.slice();
    for (var i = photoOrder.length - 1; i > 0; i--) {   // shuffle, then show each once before repeating
      var j = Math.floor(Math.random() * (i + 1)), t = photoOrder[i];
      photoOrder[i] = photoOrder[j]; photoOrder[j] = t;
    }
  }
  var id = photoOrder[photoIdx++];
  fetch(API_URL + '?token=' + encodeURIComponent(TOKEN) + '&photo=' + encodeURIComponent(id), { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.image) throw new Error((j && j.error) || 'no image');
      showPhoto('data:' + (j.type || 'image/jpeg') + ';base64,' + j.image);
    })
    .catch(function () { showPhoto(randomPhotoSrc()); });
}

// ----- Demo data (open the page with #demo to preview) -----
function demoData() {
  var d = new Date();
  function at(dd, h, m) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + dd, h, m).toISOString(); }
  function day(dd) { return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + dd)); }
  return {
    date: ymd(d), updated: d.toISOString(),
    events: [
      { title: 'Studio day', allDay: true, start: day(0), end: day(1), color: '#33b679', location: '' },
      { title: 'Call with booking agent', allDay: false, start: at(0, 14, 0), end: at(0, 15, 0), color: '#f4511e', location: 'Zoom' },
      { title: 'Rehearsal', allDay: false, start: at(1, 18, 30), end: at(1, 21, 0), color: '#8e24aa', location: 'Downtown Denver' },
      { title: 'Gym', allDay: false, start: at(2, 8, 0), end: at(2, 9, 0), color: '#039be5', location: '' },
      { title: 'Mix session', allDay: false, start: at(2, 13, 0), end: at(2, 17, 0), color: '#33b679', location: '' },
      { title: 'Flight to LA', allDay: false, start: at(4, 7, 15), end: at(4, 9, 5), color: '#f6bf26', location: 'DEN' },
      { title: 'Show: Los Angeles', allDay: false, start: at(4, 22, 0), end: at(4, 23, 59), color: '#d50000', location: 'Hollywood' },
      { title: 'Flight home', allDay: false, start: at(5, 12, 0), end: at(5, 14, 30), color: '#f6bf26', location: 'LAX' },
      { title: 'Content shoot', allDay: false, start: at(7, 11, 0), end: at(7, 15, 0), color: '#8e24aa', location: '' },
      { title: 'Management call', allDay: false, start: at(8, 10, 0), end: at(8, 11, 0), color: '#039be5', location: '' }
    ],
    emails: { lastRun: Date.now(), items: [
      { title: 'MC4D March date offer', summary: 'Promoter offered a March 3 slot at $1,500 and needs an answer by Friday.', status: 'Needs reply', people: ['Promoter'], lastDate: Date.now() - 3 * 3600000 },
      { title: 'AGT video call prep', summary: 'Becca shared the questions for Friday. Nothing needed until then.', status: 'FYI', people: ['Becca Haddad'], lastDate: Date.now() - 26 * 3600000 },
      { title: 'Mix revisions for Gone', summary: 'Sent v3 to Carson, waiting on his notes.', status: 'Waiting on them', people: ['Carson Becker'], lastDate: Date.now() - 2 * 86400000 }
    ] }
  };
}

// ----- Emails (the same cards as the Emails tab on the to-do site) -----
// They come through the calendar script with your token, since the database keeps them private.
var MAIL_RANK = { 'Needs reply': 0, 'Waiting on them': 1, 'FYI': 2 };
var MAIL_CHIP = { 'Needs reply': 'need', 'Waiting on them': 'wait', 'FYI': 'fyi' };
function ago(ms) {
  var s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  var d = Math.round(s / 86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
}
function renderMail() {
  var panel = document.getElementById('mail');
  var em = data && data.emails;
  if (!em || (em.error && !(em.items || []).length)) { panel.hidden = true; return; }
  var items = (em.items || []).slice().sort(function (a, b) {
    var ra = a.status in MAIL_RANK ? MAIL_RANK[a.status] : 2, rb = b.status in MAIL_RANK ? MAIL_RANK[b.status] : 2;
    return (ra - rb) || ((b.lastDate || 0) - (a.lastDate || 0));
  });
  var need = items.filter(function (m) { return m.status === 'Needs reply'; }).length;
  document.getElementById('mail-count').textContent = need ? need + ' need reply' : '';
  var html = '';
  if (!items.length) html = '<div class="none">No active Chasyn email in the last two weeks</div>';
  items.forEach(function (m) {
    var who = (m.people || []).slice(0, 2).join(', ');
    html += '<div class="mcard"><div class="mt"><div class="mtitle">' + esc(m.title || 'Email') + '</div>' +
      '<div class="chip ' + (MAIL_CHIP[m.status] || 'fyi') + '">' + esc(m.status || 'FYI') + '</div></div>' +
      (m.summary ? '<div class="msum">' + esc(m.summary) + '</div>' : '') +
      '<div class="mmeta">' + esc((who ? who + ' \u00b7 ' : '') + (m.lastDate ? ago(m.lastDate) : '')) + '</div></div>';
  });
  document.getElementById('mails').innerHTML = html;
  panel.hidden = false;
  panel.className = 'mail';
  if (panel.scrollHeight > panel.clientHeight + 2) panel.className = 'mail fade';
}

// ----- To-do list (live from Firebase, read-only on the TV) -----
var MAX_TASKS = 12;          // anything past what fits fades out at the bottom
var DONE_LINGER_MIN = 10;    // a task checked off shows struck through this long, then leaves
var todoTasks = null;

function renderTodo() {
  var panel = document.getElementById('todo');
  if (!todoTasks) return;
  var now = Date.now();
  var open = todoTasks.filter(function (t) { return !t.done; })
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var recent = todoTasks.filter(function (t) { return t.done && t.doneAt && now - t.doneAt < DONE_LINGER_MIN * 60000; });
  document.getElementById('todo-count').textContent = open.length + ' open';
  var list = open.slice(0, MAX_TASKS).concat(recent);
  var html = '';
  if (!list.length) html = '<div class="none">All clear</div>';
  list.forEach(function (t) {
    var firstNote = String(t.notes || '').split('\n')[0].trim();
    html += '<div class="task' + (t.done ? ' just-done' : '') + '"><div class="box"></div><div>' +
      '<div class="t">' + esc(t.title || '') + '</div>' +
      (firstNote ? '<div class="n">' + esc(firstNote) + '</div>' : '') + '</div></div>';
  });
  document.getElementById('tasks').innerHTML = html;
  panel.hidden = false;
  panel.className = 'todo';
  if (panel.scrollHeight > panel.clientHeight + 2) panel.className = 'todo fade';
}

function demoTodo() {
  return [
    { title: 'Edit Alexa Capelli video', order: 0, notes: '' },
    { title: 'Chat about MC4D', order: 1, notes: 'Ask if I can play more dates' },
    { title: 'Make Gone post', order: 2, notes: '' },
    { title: 'Prepare for AGT video call on Friday', order: 3, notes: '' }
  ];
}

function startTodo() {
  if (DEMO) { todoTasks = demoTodo(); renderTodo(); return; }
  var cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || /PASTE/.test(cfg.apiKey || '')) return;   // not set up yet: panel stays hidden
  try {
    firebase.initializeApp(cfg);
    var db = firebase.firestore();
    try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
    db.collection('tasks').onSnapshot(function (snap) {
      todoTasks = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      store('todoCache', JSON.stringify(todoTasks));
      renderTodo();
    }, function () { /* keep showing the last copy; the 3 AM reload reconnects */ });
  } catch (e) {}
}

// ----- Spoken alerts -----
// Browsers only allow sound after a button press, so one press of OK on the remote turns alerts on.
// A reload would turn them off again, which is why the 3 AM reload is skipped while they're on.
var soundOn = false, audioCtx = null, bannerTimer = 0;
var announced = {};
try { announced = JSON.parse(recall('alertsDone') || '{}'); } catch (e) { announced = {}; }

function unlockSound() {
  if (soundOn) return;
  soundOn = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.resume) audioCtx.resume();
  } catch (e) { audioCtx = null; }
  document.getElementById('soundnote').hidden = true;
  ding();
  speakOut('Spoken alerts are on');
  showBanner('Alerts are on', 'Meetings are announced ' + ALERT_MINUTES + ' minutes before', 6000);
}
['keydown', 'click', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, unlockSound); });

function ding() {
  if (!audioCtx) return;
  try {
    var t = audioCtx.currentTime;
    [[880, 0], [1318.5, 0.18]].forEach(function (n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t + n[1]);
      g.gain.exponentialRampToValueAtTime(0.35, t + n[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + 1.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + n[1]); o.stop(t + n[1] + 1.3);
    });
  } catch (e) {}
}

function say(text) {
  try {
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Read "Audima Labs x Chasyn" as "Audima Labs and Chasyn", and "5:00 PM" as "5 PM".
function spoken(s) { return String(s).replace(/\s+[x\u00d7]\s+/gi, ' and ').replace(/&/g, ' and ').replace(/:00 /g, ' '); }

function showBanner(title, sub, ms) {
  document.getElementById('alert-title').textContent = title;
  document.getElementById('alert-sub').textContent = sub;
  document.getElementById('alert').hidden = false;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function () { document.getElementById('alert').hidden = true; }, ms || 90000);
}

// The voice comes from the calendar script (Gemini text-to-speech) as an audio clip, since
// Silk on Fire TV has no built-in voice. If that fails, the browser's own voice is tried.
function speakOut(text) {
  var line = spoken(text), started = Date.now();
  function after(fn) { setTimeout(fn, Math.max(0, 1400 - (Date.now() - started))); }   // let the ding finish first
  if (!TOKEN || API_URL.indexOf('http') !== 0 || !audioCtx) { after(function () { say(line); }); return; }
  fetch(API_URL + '?token=' + encodeURIComponent(TOKEN) + '&say=' + encodeURIComponent(line), { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.audio) throw new Error((j && j.error) || 'no audio');
      after(function () { playPcm(j.audio, j.rate || 24000); });
    })
    .catch(function () { after(function () { say(line); }); });
}

// Gemini sends raw 16-bit mono PCM; turn it into sound.
function playPcm(b64, rate) {
  try {
    var bin = atob(b64), n = bin.length >> 1;
    var buf = audioCtx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      ch[i] = (v >= 32768 ? v - 65536 : v) / 32768;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination); src.start();
  } catch (e) {}
}

function announce(title, mins, time) {
  showBanner(title, 'In ' + mins + ' min \u00b7 ' + time);
  if (!soundOn) return;
  ding();
  speakOut(title + ' in ' + mins + (mins === 1 ? ' minute' : ' minutes') + ', at ' + time);
}

function checkAlerts() {
  if (!data || !data.events) return;
  var now = Date.now(), changed = false;
  data.events.forEach(function (ev) {
    if (ev.allDay) return;
    var start = Date.parse(ev.start), left = start - now;
    if (!(left > 0 && left <= ALERT_MINUTES * 60000 + 30000)) return;
    var key = ev.title + '|' + ev.start;
    if (announced[key]) return;
    announced[key] = now; changed = true;
    announce(ev.title, Math.max(1, Math.round(left / 60000)), fmtTime(new Date(start)));
  });
  Object.keys(announced).forEach(function (k) {
    if (now - announced[k] > 24 * 3600000) { delete announced[k]; changed = true; }
  });
  if (changed) store('alertsDone', JSON.stringify(announced));
}

// ----- Start -----
try { todoTasks = JSON.parse(recall('todoCache')); } catch (e) { todoTasks = null; }
renderTodo();
startTodo();
setInterval(renderTodo, 60 * 1000);   // lets checked-off tasks age out
try { data = JSON.parse(recall('boardCache')); } catch (e) { data = null; }
tick();
fetchCalendar();
nextPhoto();
setInterval(fetchCalendar, CALENDAR_REFRESH_MIN * 60 * 1000);
setInterval(nextPhoto, PHOTO_CHANGE_MIN * 60 * 1000);
setInterval(checkAlerts, 15 * 1000);
</script>
</body>
